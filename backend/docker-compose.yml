services:
  mysql:
    image: mysql:8.0
    container_name: job_portal_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_portal
    ports:
      - "3307:3306"
    volumes:
      - job_portal_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: job_portal_phpmyadmin
    restart: always
    ports:
      - "8086:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  job_portal_mysql_data:
